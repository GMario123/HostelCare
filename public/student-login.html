<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | HostelCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-container">
    
    <section class="login-form-section">
      <a class="back-link" href="index.html">← Back to Home</a>
      <p class="eyebrow">STUDENT PORTAL</p>
      <h2>Welcome Back!</h2>
      <p class="login-subtitle">Sign in to access your hostel dashboard.</p>

      <form id="studentLoginForm">
        <label for="studentEmail">Email Address</label>
        <input
          type="email"
          id="studentEmail"
          name="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >

        <label for="studentPassword">Password</label>
        <input
          type="password"
          id="studentPassword"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <p id="studentLoginMessage" class="form-message" role="alert"></p>

        <button type="submit" class="login-button">
          Sign In as Student
        </button>
      </form>

      <p class="login-footer">
        New student?
        <a href="student-register.html">Create an account</a>
      </p>

      <p class="login-footer">
        Administrator?
        <a href="admin-login.html">Admin Login</a>
      </p>
    </section>
  </main>
  <script src="student-login.js"></script>
</body>
</html>
